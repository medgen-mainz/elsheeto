name: release-please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.BOT_TOKEN }}
          include-component-in-tag: false

  # Nothing is published until the full CI suite passes on the release commit.
  # That includes the `package` job, which rebuilds the wheel from the sdist and
  # imports it, so an unusable artifact can never reach PyPI.
  ci:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/main.yml
    permissions:
      contents: read

  publish:
    needs: [release-please, ci]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # Configure this environment in the repository settings to require a manual
    # approval before any upload to PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/elsheeto/
    permissions:
      # The only credential required: a short-lived OIDC token exchanged with
      # PyPI Trusted Publishing. No long-lived API token is stored in secrets.
      id-token: write
    steps:
      - name: Download the artifacts CI already built and verified
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Trusted Publishing + PEP 740 attestations; no user/password.
          attestations: true
