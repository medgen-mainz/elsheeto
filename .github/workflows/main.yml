name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Allows the release workflow to gate publishing on a full CI run.
  workflow_call:

# Least privilege by default; jobs opt in to more where they need it.
permissions: {}

# Replaces the third-party `pull-request-workflow-cancel` action.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked --all-groups

      - name: Build docs
        run: uv run --no-sync sphinx-build -b html docs docs/_build/html

  formatting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked --all-groups

      - name: Run Lint
        run: |
          uv run --no-sync black --check --diff --preview src tests examples
          uv run --no-sync ruff check src tests examples

      - name: Run Type Checks
        run: uv run --no-sync pyright src tests examples

  testing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.13'
          - '3.14'
    needs: formatting
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "${{ matrix.python-version }}"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked --all-groups --python "${{ matrix.python-version }}"

      - name: Run tests
        run: |
          uv run --no-sync pytest \
            --cov=src/elsheeto --cov-report=term-missing --durations 5 -s \
            tests/ src/elsheeto

  # Builds the real distribution artifacts and proves they are usable. Without
  # this, a malformed sdist can silently publish a metadata-only wheel that
  # installs cleanly and then fails at `import`.
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - name: Rebuild wheel from the sdist
        run: uv build --wheel --out-dir dist-from-sdist dist/*.tar.gz

      - name: Validate metadata and wheel contents
        run: |
          uvx twine check dist/* dist-from-sdist/*
          uvx check-wheel-contents dist-from-sdist/*.whl

      - name: Install sdist-built wheel into a clean environment and import it
        run: |
          uv venv /tmp/smoke --python 3.13
          uv pip install --python /tmp/smoke/bin/python dist-from-sdist/*.whl
          /tmp/smoke/bin/python -c "
          import elsheeto, pathlib
          assert (pathlib.Path(elsheeto.__file__).parent / 'py.typed').is_file(), 'py.typed missing from wheel'
          print('package OK:', elsheeto.__version__)
          "

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
