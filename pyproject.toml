[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{name = "Manuel Holtgrewe"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12,<3.0",
]
description = "I/O and models in type-annotated Python for NGS sample sheets: Illumina and Aviti"
keywords = []
license = "MIT"
license-files = ["LICENSE"]
name = "elsheeto"
version = "0.3.2"
readme = "README.md"
requires-python = ">=3.13"

[project.urls]
Documentation = "https://github.com/medgen-mainz/elsheeto"
Issues = "https://github.com/medgen-mainz/elsheeto/issues"
Source = "https://github.com/medgen-mainz/elsheeto"

[tool.hatch.version]
path = "elsheeto/version.py"

[dependency-groups]
dev = [
    "black==25.9.0",
    "coverage>=7.10.7",
    "docutils>=0.18.1,<0.22",
    "flake8>=3.6.0",
    "pyright",
    "pytest-cache>=1.0",
    "pytest-cov",
    "pytest-cov>=2.4.0",
    "pytest-sugar>=0.8.0",
    "pytest>=3.0.6",
    "ruff>=0.14.2",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.20.0",
    "syrupy>=5.0.0",
]

[tool.pyright]
include = ["src/elsheeto", "examples"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
defineConstant = { DEBUG = true }
stubPath = "src/stubs"

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.ruff]
lint.ignore = [
  "E501", # line too long, handled by black
  "B008", # do not perform function calls in argument defaults
  "C901", # too complex
  # the following are known issues in generated code
  "E721", # is vs. ==
  "C409", # Unnecessary list literal
  "B028", # No stacklevel in warnings.warn
  "B904", # raise from e not used
  "C405", # Unnecessary list literal (rewrite as set literal)
  "C402", # inconvenient dictionary creation
]
lint.select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "C", # flake8-comprehensions
  "B", # flake8-bugbear
]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
addopts = "--doctest-modules"

[tool.ruff.lint.isort]
known-first-party = ["src/elsheeto"]

[tool.hatch.build.targets.wheel]
packages = ["src/elsheeto"]

# NOTE: Do *not* use `packages` here. On the sdist target it rewrites paths and
# flattens `src/elsheeto` to `elsheeto` at the archive root, after which the
# wheel target's `packages = ["src/elsheeto"]` matches nothing and hatchling
# silently emits a metadata-only wheel. The sdist must stay a faithful copy of
# the source tree so that `pip wheel <sdist>` reproduces the real wheel.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/AUTHORS.rst",
  "/CHANGELOG.md",
  "/LICENSE",
  "/Makefile",
  "/README.md",
  "/pyproject.toml",
]
exclude = [
  "/docs/_build",
  "**/__pycache__",
  "**/*.py[co]",
]
