[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{name = "Manuel Holtgrewe", email = "manuel.holtgrewe@medgen-mainz.de"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12,<3.0",
]
description = "I/O and models in type-annotated Python for NGS sample sheets: Illumina and Aviti"
keywords = [
    "aviti",
    "bioinformatics",
    "illumina",
    "ngs",
    "sample-sheet",
    "sequencing",
]
license = "MIT"
license-files = ["LICENSE"]
name = "elsheeto"
# Single-sourced from src/elsheeto/version.py, which release-please owns.
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.13"

[project.urls]
Homepage = "https://github.com/medgen-mainz/elsheeto"
Documentation = "https://elsheeto.readthedocs.io/en/latest/"
Changelog = "https://github.com/medgen-mainz/elsheeto/blob/main/CHANGELOG.md"
Issues = "https://github.com/medgen-mainz/elsheeto/issues"
Source = "https://github.com/medgen-mainz/elsheeto"

[tool.hatch.version]
path = "src/elsheeto/version.py"

[dependency-groups]
dev = [
    "coverage>=7.10.7",
    "pyright>=1.1.400",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-sugar>=1.0.0",
    "ruff>=0.14.2",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.20.0",
    "syrupy>=5.0.0",
]

[tool.pyright]
include = ["src/elsheeto", "examples"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
defineConstant = { DEBUG = true }
stubPath = "src/stubs"

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.ruff]
line-length = 120

lint.ignore = [
  "E501", # line too long, handled by the formatter
  "B008", # do not perform function calls in argument defaults
  "C901", # too complex
  # the following are known issues in generated code
  "E721", # is vs. ==
  "C409", # Unnecessary list literal
  "B028", # No stacklevel in warnings.warn
  "B904", # raise from e not used
  "C405", # Unnecessary list literal (rewrite as set literal)
  "C402", # inconvenient dictionary creation
]
lint.select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "C", # flake8-comprehensions
  "B", # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["elsheeto"]

[tool.pytest.ini_options]
addopts = [
  "--doctest-modules",
  "--strict-markers",
  "--strict-config",
  "-ra",
]
testpaths = ["tests", "src/elsheeto"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src/elsheeto"]

[tool.coverage.report]
show_missing = true
# Every statement is covered; 17 implicit branches are not, which is why this
# is 99 and not 100. It is a ratchet: raise it, never lower it.
fail_under = 99
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.hatch.build.targets.wheel]
packages = ["src/elsheeto"]

# NOTE: Do *not* use `packages` here. On the sdist target it rewrites paths and
# flattens `src/elsheeto` to `elsheeto` at the archive root, after which the
# wheel target's `packages = ["src/elsheeto"]` matches nothing and hatchling
# silently emits a metadata-only wheel. The sdist must stay a faithful copy of
# the source tree so that `pip wheel <sdist>` reproduces the real wheel.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/AUTHORS.rst",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/Makefile",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
]
exclude = [
  "/docs/_build",
  "**/__pycache__",
  "**/*.py[co]",
]
